name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Pytest Suite
      run: |
        pytest tests/ -v

    - name: Run Progressive Tutorial Scripts (01-08)
      run: |
        python examples/01_plain_llm_prompt.py
        python examples/02_tool_calling_search.py
        python examples/03_explicit_planning.py
        python examples/04_multistep_loop.py
        python examples/05_source_verification.py
        python examples/06_structured_answer_confidence.py
        python examples/07_human_in_the_loop_gates.py < /dev/null
        python examples/08_full_agent_mcp.py

    - name: Run Evaluation Harness Benchmark
      run: |
        python evals/run_evals.py --mock

